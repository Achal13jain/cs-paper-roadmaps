name: "🚀 Build & Deploy Site"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://achal13jain.github.io/cs-paper-roadmaps' }}
      REPO_URL: https://github.com/Achal13jain/cs-paper-roadmaps
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || 'G-NQGL8PZC3Z' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pyyaml jsonschema

      - name: Validate roadmap data
        run: python scripts/validate_papers.py

      - name: Regenerate site (index, roadmap pages, sitemap)
        run: python scripts/generate_html.py

      - name: Audit generated site
        run: python scripts/audit_site.py

      - name: Commit regenerated site files
        run: |
          git add index.html roadmaps sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Site files are already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "🤖 Auto-regenerate site from papers.yml [skip ci]"
            git push
          fi

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
